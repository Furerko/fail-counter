name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==4.10

      - name: Check syntax
        run: python -m py_compile fail_counter.py

      - name: Build EXE
        run: pyinstaller --onefile --console fail_counter.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fail_counter_exe
          path: dist/fail_counter.exe
